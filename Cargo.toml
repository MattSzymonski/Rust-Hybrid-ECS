[package]
name = "ecs_hybrid"
version = "0.1.0"
edition = "2021"

[dependencies]
parking_lot = "0.12"
trait_type_map = { path = "../trait_type_map" }

[[bin]]
name = "ecs_hybrid"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.release-with-debug]
inherits = "release"
debug = true