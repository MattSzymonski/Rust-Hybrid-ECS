[package]
name = "project"
version = "0.1.0"
edition = "2021"

[lib]
# `cdylib` for a hot-reloading build, where the host loads this as a DLL.
# `rlib` so a shipping build can link the project straight into the binary -
# a cdylib cannot be a Rust library dependency. Every extension already
# carries both for the same reason.
crate-type = ["cdylib", "rlib"]

[dependencies]
pill_audio = { path = "../../modules/extensions/pill_audio", default-features = false }
pill_engine = { path = "../../modules/pill_engine" }
pill_core = { path = "../../modules/pill_core" }
# The renderer, for `Sprite`: a quad with a width, a height and a fill is the
# renderer's own idea of a thing to draw, so it lives with the pipeline that
# draws it. `Position` and `Color` are universal and come from `pill_engine`
# instead.
#
# `default-features = false` drops the crate's `gpu` feature, which is what
# keeps wgpu out of this `cdylib` and out of every hot patch of it. It also
# keeps this project loadable by a headless host: cargo folds a dependency's
# resolved features into `-C metadata`, so a project that linked wgpu resolved
# a different `pill_core.dll` than a host without the renderer had mapped, and
# failed to load. A windowed host turns the feature back on through its own
# graph, and both sides unify alike either way.
pill_master_renderer = { path = "../../modules/extensions/rendering/pill_master_renderer", default-features = false }
# Linked directly so the project can name the `Spline` type. See the note in
# `init` about why this crate must not also be loaded as a module.
# `default-features = false` is a defensive no-op: `module-abi` is opt-in now,
# so the `pill_module_*` exports stay off in this build either way.
# `test-hooks` keeps the module's demo observables - the sampled height
# offset, the `GetSum` shift - that the hot-reload and bridge suites edit and
# watch for; a default build of the module computes only the documented math.
pill_spline = { path = "../../modules/extensions/pill_spline", default-features = false, features = [
    "test-hooks",
] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"

[features]
