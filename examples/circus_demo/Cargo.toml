[package]
name = "circus_demo"
version = "0.1.0"
edition = "2021"

[lib]
# `cdylib` for a hot-reloading build, where the host loads this as a DLL.
# `rlib` so a shipping build can link the project straight into the binary.
crate-type = ["cdylib", "rlib"]

[dependencies]
glam = "0.33"
pill_engine = { path = "../../modules/pill_engine" }
# The math vocabulary the engine and the UI share (positions, sizes).
pill_core = { path = "../../modules/pill_core" }
# The in-game UI (W-0028): the tuning overlay builds an egui pass with it, and
# the renderer draws the frame it publishes through the engine core's slot. A
# shared library like `pill_ui`, so the overlay's context - its fonts, its
# widget state - outlives a reload of this project.
pill_game_ui = { path = "../../modules/pill_game_ui" }
# The master renderer's data only - components, assets, pipelines. The GPU
# renderer is the host's. `default-features = false`, as for every extension,
# keeps its module exports out of this project's DLL.
pill_master_renderer_data = { path = "../../modules/extensions/pill_master_renderer/pill_master_renderer_data", default-features = false }
serde = { version = "1", features = ["derive"] }

[features]
