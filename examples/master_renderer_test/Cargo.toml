[package]
name = "italian_brainrot"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
glam = "0.33"
pill_engine = { path = "../../modules/pill_engine" }
pill_master_renderer = { path = "../../modules/extensions/rendering/pill_master_renderer", default-features = false }
serde = { version = "1", features = ["derive"] }
trait_type_map = { git = "https://github.com/MattSzymonski/Trait-Type-Map", rev = "25343a9eac856445b0fa8266df5b000326d1574b" }

[build-dependencies]
# Cooks `res/shaders/*.hlsl` into the WGSL this project loads at runtime, so the
# HLSL is the source of truth and the WGSL is generated beside it.
pill_assets = { path = "../../modules/pill_assets" }

[features]
