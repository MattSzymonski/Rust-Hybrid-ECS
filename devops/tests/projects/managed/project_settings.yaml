# Project settings for the managed fixture.
#
# One project carries what the C# suites need: the bridge surface (components,
# a resource, systems, asset imports), the extension mirrors the bridge asserts,
# and the iteration benchmark's three query shapes, which stay silent unless
# PILL_BENCH_ENTITIES names an entity count.
#
# `name` is the display name (window title); `build_binary_name` is the artifact
# file base and must contain only letters, digits and underscores. Both are
# required. `modules` is the extension list, in load order.

name: "Managed Fixture"
build_binary_name: "ManagedFixture"
version: "0.1.0"
author: "Matt Szymonski"
description: "The C# fixture: bridge surface, extension mirrors and the gated iteration benchmark."

modules:
  - "pill_spline"
  - "pill_dummy_color"
