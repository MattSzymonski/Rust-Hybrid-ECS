# Test-fixture settings for devops/tests/project.
#
# The fixture project is selected by PROJECT_PATH; this file supplies the
# required project `name` / `build_binary_name` and its extension list.
#
# Four modules: `pill_spline` and `pill_dummy_color` carry the fixture's real
# behavior (the reload suite edits the first, the C# bridge fixtures read the
# second), and `pill_dummy_math` and `pill_dummy_random` are no-op modules that
# only exercise loading several modules at once. Loading several at once is a
# path worth exercising, but it is a test's job rather than every developer's:
# declared in an example it cost every cold start and every reload cascade the
# crates to build, the DLLs to load, the watchers and the graveyards, and it
# made the engine's own benchmarks measure a configuration no real project has.
# The surplus placeholders (`pill_dummy_text`, `pill_dummy_timer`) added two
# more builds without adding a scenario, so they were removed.
#
# `test_hot_reload_migration.py` runs this file as committed - it sets
# PROJECT_PATH here and writes no settings of its own - so the multi-module
# path is covered on every default test run. `test_hot_reload_suite.py`
# overwrites this file per session and restores it afterwards, so its own
# module lists are unaffected by what is listed here.

name: "Fixture Project"
build_binary_name: "FixtureProject"

# The fixture draws nothing and declares no render components, so it selects
# no renderer: its data crate would only add a build to every cold start.
renderer: "none"

modules:
  - "pill_spline"
  - "pill_dummy_math"
  - "pill_dummy_color"
  - "pill_dummy_random"
