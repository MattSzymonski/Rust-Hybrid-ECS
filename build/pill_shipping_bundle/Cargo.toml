# Committed STUB manifest - a placeholder, not a real shipping bundle.
#
# `pill_standalone` declares `pill_shipping_bundle` as an optional path
# dependency, and cargo resolves every workspace manifest before it evaluates
# features. A missing directory here therefore breaks resolution for the whole
# workspace - including debug builds that never enable `static_project`. This
# stub exists so a fresh clone can `cargo run` with no generator step.
#
# `devops/tools/generate_shipping_bundle.py` overwrites this file (and
# `src/lib.rs`) with the real bundle for the selected project. Both are
# content-based writes, so regenerating twice shows no diff; restore the
# neutral stub with `git checkout -- build/pill_shipping_bundle`.
#
# Deliberately declares NO dependencies: the real bundle's dependency set is
# derived from the project's `project_settings.yaml`, and naming any project
# here would bake one project's identity into the repository.
[package]
name = "pill_shipping_bundle"
version = "0.0.0"
edition = "2021"

[dependencies]
