[package]
name = "pill_core"
version = "0.1.0"
edition = "2021"

[lib]
# `dylib` makes this one shared library that the host executable and every
# dynamically loaded module link against instead of each embedding a private
# copy. That is what keeps the process-global state living here
# single-instance across the DLL boundary, most importantly the `tracing`
# dispatcher: a module linking its own copy has no subscriber installed, so
# every log line it emits is silently dropped.
#
# `rlib` is kept so a monolithic release build can link everything statically.
crate-type = ["rlib", "dylib"]

[dependencies]
glam = { version = "0.33", features = ["serde"] }
pill_core_macros = { path = "../pill_core_macros" }
libloading = "0.8"
notify = "6"
serde_json = "1"
thiserror = "2"
miette = { version = "7", features = ["derive", "fancy"] }
colored = "2"
winit = { version = "0.30", optional = true }
tracing = "0.1"
tracing-log = "0.2"
# The default `tracing-log` feature would auto-bridge `log` inside
# `SubscriberInitExt::init`; the bridge is owned explicitly in the telemetry
# builder instead, so it is installed exactly once and its failure is reported
# as a no-op rather than a panic.
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "smallvec",
    "fmt",
    "ansi",
    "std",
    "registry",
    "env-filter",
    "json",
] }
tracing-appender = "0.2"
tracing-tracy = { version = "0.11", optional = true }
tracy-client = { version = "0.18", optional = true }
metrics = { version = "0.24", optional = true }

[dev-dependencies]
log = "0.4"

[features]
rendering = ["dep:winit"]
dev-logs = []
tracy = ["dep:tracing-tracy", "dep:tracy-client"]
metrics = ["dep:metrics"]
# Full profiling: zones, text, plots, messages, threads, frame marks,
# plus Tracy system-level features (sampling, context switches, CPU info).
profiling = [
    "dep:tracy-client",
    "tracy-client/enable",
    "tracy-client/sampling",
    "tracy-client/context-switch-tracing",
    "tracy-client/system-tracing",
    "tracy-client/ondemand",
    "tracy-client/code-transfer",
    "tracy-client/callstack-inlines",
    "tracy-client/crash-handler",
]
# Investigative fine-grained zones (`profile_scope_fine!` -> profile::fine).
profiling-fine = ["profiling"]
# Minimal overhead: zones + frame marks only. No text, plots, messages, or threads.
profiling-minimal = [
    "dep:tracy-client",
    "tracy-client/enable",
    "tracy-client/sampling",
    "tracy-client/ondemand",
]
# Debug: full profiling + instrumentation verification (~50% overhead).
profiling-verify = ["profiling", "tracy-client/verify"]
