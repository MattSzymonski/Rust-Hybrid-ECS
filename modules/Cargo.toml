[workspace]
members = [
    # One folder per layer, each holding only crates, so every one is globbed:
    # every path a member glob matches must be a crate.
    #
    # The engine: the shared `pill_core` and `pill_engine_core` dylibs, the
    # `pill_engine` facade compiled into every DLL, and their proc macros.
    "engine/*",
    # The asset pipeline: cooking and moving source assets, and the pack format
    # a shipping build embeds.
    "assets/*",
    # The renderer contract (`pill_renderer_api`) and the plain UI frame it
    # carries (`pill_ui_frame::UiFrame`, W-0032): one shared dylib, so the
    # frame's UI type has one identity across every artifact that builds or
    # draws it.
    "rendering/*",
    # The in-game egui UI (W-0028): a shared dylib, so a project's egui context
    # outlives a project reload and its frame is neutral data the renderer
    # draws.
    "ui/*",
    # Hosting and running a project: the player, the development host and the
    # source scanner the host patches through.
    "hosting/*",
    # The frontends - `pill_standalone`, `pill_web` - and the `pill_input`
    # gamepad glue they and the editor share. Every crate here is named
    # `pill_*`, the same convention as the extensions: `frontends/` also holds
    # the `editor/` folder, which is not a crate itself.
    "frontends/pill_*",
    # The egui editor frontend: its executable and its shared core dylib.
    "frontends/editor/*",
    # The C# half of the engine: the bridge crate, plus the managed runtime and
    # compiler that live beside it. This one is named explicitly rather than
    # globbed, because `csharp/` is not all crates - the other two are MSBuild
    # projects with no manifest for cargo to read.
    "csharp/pill_csharp_bridge",
    # Extensions: one folder per extension, `extensions/<extension>/`, holding
    # that extension's crates. Every crate is named `pill_*`, which is the
    # convention this glob relies on: a folder also holds non-crate
    # directories (the host's `generated/`), and every path a member glob
    # matches must be a crate. Adding an extension is just creating a folder.
    "extensions/*/pill_*",
    # The host-generated `host_module_<crate>` wrappers, one per loaded
    # extension crate, in the `generated/` folder of the extension they wrap.
    "extensions/*/generated/*",
    # The host-generated `host_project_<package>` members: projects live
    # outside this workspace, so their members are generated here instead.
    "projects_generated/*",
]
# `extensions/rendering` holds the older renderer crates, which no build uses.
#
# The two anchors keep the generated-member globs above from ever matching
# nothing. Cargo reads a glob that matches nothing as a literal path and then
# fails to load the workspace - which is exactly the state of a fresh clone,
# before the host has generated anything. Each anchor is a tracked README the
# glob always matches, excluded here so it never becomes a member.
#
# NOTE: do NOT exclude the generated `host_module_*` / `host_project_*` crates.
# They are generated by the host at runtime and are gitignored, so a stale one
# left by an earlier run can fail `cargo check --workspace` - but excluding them
# breaks the host itself, which builds them with `cargo build --package
# host_project_<name>` from this workspace root and needs them to resolve as
# members. Membership is also what makes the project resolve the same
# dependency graph as the host, which is what keeps component type identities
# and the shared library's mangled symbol names in agreement. A stale generated
# crate is fixed by letting the host regenerate it, not by excluding it.
exclude = [
    "extensions/rendering",
    "extensions/_workspace_anchor",
    "projects_generated/README.md",
]
resolver = "2"

# Workspace-wide lint policy, inherited by every member via `lints.workspace = true`.
#
# These are the lints that pin conventions this codebase already follows -
# unsafe operations inside `unsafe fn` bodies must be inside explicit `unsafe`
# blocks, and every `unsafe` block must carry a `// SAFETY:` justification -
# so enabling them costs nothing today and ratchets against regressions. Start
# at `warn`; the project's 0-warning discipline means a lint can be promoted
# to `deny` once it is known to be clean across every feature configuration.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

# Release profiles are defined here, at the workspace root, so every member
# builds with the same optimization settings. They used to live in
# `pill_engine/Cargo.toml`, where Cargo ignored them because profiles must be
# declared by the root package; the host now logs the intent instead of a
# "profiles for the non root package will be ignored" warning.
#
# NOTE: `panic = "abort"` was set here and could never build. `pill_core` is a
# `dylib`, and a Rust dylib is always compiled with unwinding, so every release
# build failed with "the linked panic runtime `panic_unwind` is not compiled
# with this crate's panic strategy `abort`". Unwinding is also what the
# `catch_unwind` guards extensions use across the C ABI boundary need:
# with `abort`, a panicking module took the whole host down instead of being
# caught and rolled back. The setting was incompatible with this workspace
# twice over.
#
# NOTE: `lto = "fat"` cannot be combined with the `-C prefer-dynamic` that
# `.cargo/config.toml` sets for the hot-reload build - rustc refuses the pairing
# outright when targeting Windows. A release binary links everything into one
# image and needs no shared engine, so it clears the flag; no cargo setting can,
# because cargo merges config arrays rather than replacing them. Build with
# `devops/ci_cd/build_release.sh`, which clears `RUSTFLAGS` and forwards its
# arguments to cargo.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

# Speed-optimized release profile: trades binary size for maximum throughput.
# Uses opt-level=3 (aggressive inlining, loop unrolling, auto-vectorization)
# instead of opt-level="s" (size-optimized). Recommended for production
# deployments where throughput matters more than binary size.
[profile.release-fast]
inherits = "release"
opt-level = 3

[profile.release-with-debug]
inherits = "release"
debug = true

# Optimized development profile: the dev host with hot reload, at full speed.
# `release` cannot host hot reload (its `lto = "fat"` refuses `-C prefer-dynamic`),
# so measuring performance in a dev host needs a profile of its own. The host
# builds every module with its own profile, so modules follow automatically.
[profile.dev-optimized]
inherits = "dev"
opt-level = 3
