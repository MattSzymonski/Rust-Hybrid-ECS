[workspace]
members = [
    "pill_editor",
    "pill_engine",
    "pill_engine_macros",
    "pill_core",
    "pill_core_macros",
    "pill_host",
    "pill_hot_scan",
    "pill_standalone",
    "pill_build_support",
    # Every crate under `optional/` is an optional engine module, discovered by
    # this glob so adding one is just creating a directory. The glob is scoped
    # to that directory rather than the workspace root because every path it
    # matches must be a crate, and `modules/` also holds non-Rust directories
    # plus `pill_standalone_temp/`, which the host creates at runtime.
    "optional/*",
]
resolver = "2"

# Release profiles are defined here, at the workspace root, so every member
# builds with the same optimization settings. They used to live in
# `pill_engine/Cargo.toml`, where Cargo ignored them because profiles must be
# declared by the root package; the host now logs the intent instead of a
# "profiles for the non root package will be ignored" warning.
#
# NOTE: `panic = "abort"` disables the `catch_unwind` guards that optional
# modules use across the C ABI boundary. That is fine for a monolithic release
# binary, but a panicking module aborts the whole host in a `--release` build
# with hot reload; drop this line if release hot reload must survive module
# panics.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Speed-optimized release profile: trades binary size for maximum throughput.
# Uses opt-level=3 (aggressive inlining, loop unrolling, auto-vectorization)
# instead of opt-level="s" (size-optimized). Recommended for production
# deployments where throughput matters more than binary size.
[profile.release-fast]
inherits = "release"
opt-level = 3

[profile.release-with-debug]
inherits = "release"
debug = true
