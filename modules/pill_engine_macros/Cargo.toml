[package]
name = "pill_engine_macros"
version = "0.1.0"
edition = "2021"
description = "Procedural macros for Pill registration: #[derive(PillComponent)], #[pill_module], #[pill_project]."

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
