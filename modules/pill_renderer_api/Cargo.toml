[package]
name = "pill_renderer_api"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

# The renderer's plain data: components, assets, the default pipelines and
# their WGSL, the frame the renderer draws, and the backend trait. Linked by the
# host in every posture and by projects, so it must never depend on wgpu or
# winit - that is what keeps the graphics stack in exactly one loadable module.
[lib]
crate-type = ["rlib"]

[dependencies]
pill_core = { path = "../pill_core" }
pill_core_macros = { path = "../pill_core_macros" }
pill_engine = { path = "../pill_engine" }
trait_type_map = { git = "https://github.com/MattSzymonski/Trait-Type-Map", rev = "25343a9eac856445b0fa8266df5b000326d1574b" }

serde = { version = "1", features = ["derive"] }
# `#[engine_error]` expands to `thiserror` and `miette` derives.
thiserror = "2"
miette = { version = "7", features = ["derive"] }
glam = { version = "0.33", features = ["serde", "bytemuck"] }
bytemuck = { version = "1.4", features = ["derive"] }
# The shaders' slot tables: name-keyed like a map, with the declaration order
# the uniform buffer packs in. `indexmap` is `ordermap`'s current name.
indexmap = "2"
# `jpeg` alongside `png`: the committed helmet asset in `master_renderer_test`
# ships its PBR maps as JPEG, and re-encoding them to PNG would multiply the
# committed size for no gain in fidelity.
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
] }
tobj = "3"
# Development shader reload only (`shader-hot-reload`): the cooker the build
# script runs, and a watcher on the shader sources.
pill_assets = { path = "../pill_assets", optional = true }
notify = { version = "6", optional = true }

[features]
default = []
# Watch `src/config/` for HLSL edits at runtime, re-cook them and update the
# shader assets built from them. A development convenience: the host enables it
# with `hot_reload`, and a shipping build never compiles it.
shader-hot-reload = ["dep:pill_assets", "dep:notify"]

[build-dependencies]
# Turns `src/config/**/*.hlsl` into the WGSL this crate embeds, so a shader
# that is not committed is still the one that compiles.
pill_assets = { path = "../pill_assets" }
