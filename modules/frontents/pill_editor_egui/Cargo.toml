[package]
name = "pill_editor_egui"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[dependencies]
pill_core = { path = "../../pill_core" }
# The `#[engine_error]` attribute behind this binary's error type.
pill_core_macros = { path = "../../pill_core_macros" }
# The engine's input event types this executable translates winit events
# into, the same shared dylib `pill_input` maps into: frontends name the
# core, never the `pill_engine` facade with its per-DLL registries.
pill_engine_core = { path = "../../pill_engine_core" }
thiserror = "2"
miette = { version = "7", features = ["derive"] }
tracing = "0.1"
# What runs the game: the frame driver this executable's loop is written
# against, for hosting the project and its extensions in every posture.
pill_runtime = { path = "../../hosting/pill_runtime", features = ["rendering"] }
# The development host: builds, loads, watches and hot-patches the project
# and every extension, including the editor shell module. The editor has no
# shipping posture yet (Stage 25 decides what a shipped editor is), so
# unlike `pill_standalone` this dependency is unconditional.
pill_host = { path = "../../hosting/pill_host", default-features = false, features = [
    "hot_reload",
    "hot_patch",
    "rendering",
] }
# The window and event loop: only frontends link winit.
winit = "0.30"
# The composition overlay and the popup placement (Stage 21, D23/D24): the
# DirectComposition device, target and visual that put the overlay above the
# scene's child window, and the monitor work area the popups flip inside.
# Pinned to the version wgpu-hal's DX12 backend uses, so the visual pointer
# it takes and the one this crate hands it are the same COM interface. Only
# this executable names the `windows` crate: its large raw-dylib import set
# must never reach a shared dylib (AGENTS.md).
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_DirectComposition",
] }
# winit's keyboard and mouse events as engine input events, shared with the
# standalone.
pill_input = { path = "../pill_input", features = ["winit"] }
# The editor's own renderer for its UI: the executable owns its wgpu device
# and presents the editor with it (D8, D19). The same wgpu the renderer
# module uses - a second version in one process would bring a second copy of
# its global types.
wgpu = "30.0.0"
# egui's wgpu painter: it draws the shell's frame meshes into the
# composition overlay's swapchain. Pinned to the egui family's version; it
# resolves the same `wgpu` 25 the line above pins.
egui-wgpu = "0.36.2"
# The shared egui stack: the boundary resources both this executable and the
# reloadable egui shell module speak, and the widget/docking libraries the
# shell draws with. A shared dylib, like `pill_ui` was, so both sides agree
# on the resource types' identity across a reload.
pill_ui_egui = { path = "../../pill_ui_egui" }
# The egui editor's model: the docking layout, the shared selection and the
# editor snapshot the shell's tabs read. A shared dylib like the boundary,
# consumed by both the executable's fallback UI and the reloadable shell.
pill_editor_core_egui = { path = "../pill_editor_core_egui" }
# The asset settings documents the Inspector's asset rows edit are JSON.
serde_json = "1"
