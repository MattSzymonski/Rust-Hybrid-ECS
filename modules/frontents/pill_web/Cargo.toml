[package]
name = "pill_web"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

# The browser frontend: runs a statically linked project in a page's canvas.
# Every dependency is wasm-only, so on native targets this crate compiles to
# nothing and the workspace's native builds are unaffected.
[target.'cfg(target_arch = "wasm32")'.dependencies]
pill_core = { path = "../../pill_core" }
# What runs the game: the engine, the linked project and the renderer attached
# to the canvas.
pill_runtime = { path = "../../hosting/pill_runtime", features = ["rendering"] }
# The editor posture (Stage 30): the shell's plain-data contract and the UI
# renderer its frame draws through. The shell crate itself is linked by the
# generated bundle, which calls its `register`.
pill_editor_api = { path = "../../hosting/pill_editor_api" }
pill_engine_core = { path = "../../pill_engine_core" }
pill_ui = { path = "../../pill_ui" }
pill_ui_wgpu = { path = "../../pill_ui_wgpu" }
wgpu = "25.0.0"
# The canvas window and the browser's event loop.
winit = "0.30"
# The canvas's keyboard and mouse events as engine input events.
pill_input = { path = "../pill_input", features = ["winit"] }
wasm-bindgen = "0.2"
# Raw JS for calls web-sys has no typed bindings for (focus with preventScroll).
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "Window",
] }
# Panic messages in the browser console instead of `unreachable`.
console_error_panic_hook = "0.1"
