[package]
name = "editor"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[dependencies]
pill_host = { package = "pill_host", path = "../../hosting/pill_host", features = [
    "rendering",
] }
pill_engine = { path = "../../pill_engine" }
pill_core = { path = "../../pill_core" }
# The gamepads, shared with the standalone frontend. Keyboard and mouse come
# from the Scene panel's DOM events instead (`scene_input`).
pill_input = { path = "../pill_input", features = ["gamepad"] }
# The telemetry bootstrap every frontend shares.
pill_runtime = { path = "../../hosting/pill_runtime" }
pill_core_macros = { path = "../../pill_core_macros" }
dioxus = { version = "0.7", features = ["desktop"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
miette = { version = "7", features = ["derive"] }
tracing = "0.1"

[build-dependencies]
pill_hot_scan = { path = "../../hosting/pill_hot_scan" }

[dev-dependencies]
# The editor's unit tests hand-write tiny `impl Component` test doubles and
# need `impl_trait_accessible!` to reach them through the engine's storage;
# production code never touches this crate.
# Inspector tests use the real renderer component field layouts, which are
# plain data: no GPU renderer is needed to test them.
pill_master_renderer_data = { path = "../../extensions/pill_master_renderer_data" }

[features]
# Match a normal `cargo run` of pill_standalone: per-function hot patching is
# on so the Systems tab's `hot_patchable` column is meaningful.
default = ["hot_patch"]
# Per-function hot patching, forwarded to the host. Implies `hot_reload`.
hot_patch = ["pill_host/hot_patch"]
# The editor is always windowed - its `pill_host` dependency above already
# forces `rendering`. The feature exists so the editor can be selected as
# `build_runner::apply_cargo_host_overrides`'s cargo anchor (dx hosts keep it)
# with the same feature vocabulary every frontend names; a frontend that had
# no `rendering` feature to name would break that selection.
rendering = ["pill_host/rendering"]
# Enable Tracy profiling through the shared telemetry stack.
profiling = ["pill_host/profiling"]
# Investigative fine-grained profiling zones.
profiling-fine = ["pill_host/profiling-fine"]
# Repeated numerical measurements through the shared metrics recorder.
metrics = ["pill_host/metrics"]
# Compile the simple developer log macros (`log!`, `warn!`, `error!`).
dev-logs = ["pill_host/dev-logs"]

# The engine's own native surface on Linux (`src/scene_window.rs`): a Wayland
# subsurface on GDK's connection, or an X11 child window. All of these are
# already in the build through tao and wgpu; the versions match theirs.
[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21"
raw-window-handle = "0.6"
gtk = "0.18"
wayland-client = { version = "0.31", features = ["system"] }
wayland-backend = { version = "0.3", features = ["client_system"] }
