[package]
name = "pill_editor_core"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[lib]
name = "pill_editor_core"
path = "src/lib.rs"
# A shared `dylib`, like `pill_engine_core`: the editor executable (docking)
# and the reloadable editor shell module (panels, commands) both use these
# types, and one compiled copy per process is what lets the same layout model
# and command values cross between them. With `-C prefer-dynamic` every user
# imports `pill_editor_core.dll`. A change to this crate therefore rebuilds its
# users and restarts the editor (plan decision D17).
#
# `rlib` is kept for the crate's own unit tests and any static build.
crate-type = ["rlib", "dylib"]

# Every dependency below is pinned to the features the editor's builds union
# onto it - none beyond their defaults - so the host's graph-only dependency on
# this crate (`pill_host`'s `editor_core_dependency_graph`) resolves the same
# tree as a module that uses it.
[dependencies]
pill_core = { path = "../../pill_core" }
pill_core_macros = { path = "../../pill_core_macros" }
pill_engine = { path = "../../pill_engine" }
pill_assets = { path = "../../pill_assets" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
miette = { version = "7", features = ["derive"] }

[dev-dependencies]
# The snapshot and command tests register the renderer's real components,
# which are plain data: no GPU renderer is needed to test them.
pill_master_renderer_data = { path = "../../extensions/pill_master_renderer/pill_master_renderer_data" }
