[package]
name = "pill_standalone"
version = "0.1.0"
edition = "2021"

[dependencies]
pill_core = { path = "../pill_core" }
pill_host = { package = "pill_host", path = "../pill_host" }
miette = "7"
tracing = "0.1"

[build-dependencies]
pill_hot_scan = { path = "../pill_hot_scan" }

[features]
# Windowed mode: `host::run` owns the winit event loop and wgpu renderer
# behind this feature; the binary itself contains no GPU or window code.
rendering = ["pill_host/rendering"]
# Enable Tracy profiling through the shared telemetry stack.
profiling = ["pill_host/profiling"]
# Investigative fine-grained profiling zones.
profiling-fine = ["pill_host/profiling-fine"]
# Repeated numerical measurements through the shared metrics recorder.
metrics = ["pill_host/metrics"]
# Compile the simple developer log macros (`log!`, `dev_warn!`, `dev_error!`).
dev-logs = ["pill_host/dev-logs"]
