[package]
name = "pill_standalone"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[dependencies]
pill_core = { path = "../pill_core" }
# The `#[engine_error]` attribute behind this binary's own error types, plus
# the two crates it expands into.
pill_core_macros = { path = "../pill_core_macros" }
thiserror = "2"
miette = { version = "7", features = ["derive"] }
tracing = "0.1"
# What runs the game, in both postures: the frame driver the loops are written
# against, telemetry, and - shipping - the engine and the linked project.
pill_runtime = { path = "../pill_runtime" }
# The development host, linked only by `dev`. A shipping build does not
# compile it at all: the dependency structure, not a feature flag, is what keeps
# development code out of a shipped binary.
pill_host = { package = "pill_host", path = "../pill_host", default-features = false, optional = true }
# The window and event loop of a windowed run. Only the frontend links winit.
winit = { version = "0.30", optional = true }
# A windowed run's input: winit's keyboard and mouse events as engine input
# events, and the gamepads.
pill_input = { path = "../pill_input", features = ["winit", "gamepad"], optional = true }

# The generated shipping bundle, linked only by `shipping`. It declares the
# project and every extension selected by the project's
# `project_settings.yaml`, and is regenerated by
# `devops/tools/generate_shipping_bundle.py` before a shipping build. The
# bundle's manifest keeps each module's `#[no_mangle]` `pill_module_*` exports
# off via `default-features = false`: statically there is no host looking those
# up, and two definitions of one symbol is a linker error.
#
# The path is a stable, project-agnostic scratch location under the repository
# root (`<repo>/build/pill_shipping_bundle`): cargo needs a static path here,
# but only the bundle's CONTENTS change per project (one shipping binary is
# built at a time), so no project-specific path is ever hardcoded.
#
# The directory must EXIST even for a debug build that never enables
# `shipping`. Cargo resolves every manifest in the workspace before it
# evaluates features, so `optional = true` means "do not compile it", not "do
# not look for it" - a missing directory fails resolution for the whole
# workspace, `cargo run -p editor` included. A neutral stub crate is therefore
# committed there (the one exception to `build/` being gitignored) so a fresh
# clone builds with no generator step. A shipping build overwrites it, which
# makes it show up as modified in `git status`; restore it afterwards with
# `git checkout -- build/pill_shipping_bundle`.
pill_shipping_bundle = { path = "../../build/pill_shipping_bundle", optional = true }

[build-dependencies]
pill_hot_scan = { path = "../pill_hot_scan" }

[features]
# Exactly one of `dev` and `shipping` is selected; `main.rs` refuses anything
# else. `dev` is the default, with live per-function patching on top.
#
# `hot_patch` sits in the defaults so a plain dev `cargo run` gets live
# per-function patching with no extra flag. It stays a named feature (rather
# than being folded into `dev`) for two reasons: shipping builds drop it cleanly
# with `--no-default-features`, and a dev run can opt out with
# `--no-default-features --features dev` when it wants the pure reload path (a
# benchmark measuring reload, or a run where the patch machinery must stay out).
default = ["dev", "hot_patch"]
# The development posture: the development host builds, loads, watches and
# reloads the project and every extension.
dev = ["dep:pill_host", "pill_host/hot_reload"]
# The shipping posture: the runtime runs the project and extensions the
# generated bundle links in. Nothing is watched, built or loaded at runtime, and
# `pill_host` is not compiled. Build it with `--package pill_standalone`, not
# `--workspace`: cargo unions the features requested for a package across one
# invocation, and `pill_editor` asks for `pill_host`, which would bring `dev`
# back.
shipping = ["dep:pill_shipping_bundle"]
# Per-function hot patching, forwarded to the host. Implies `dev`.
hot_patch = ["dev", "pill_host/hot_patch"]
# Windowed mode: the winit event loop and its input here, the renderer attach in
# the runtime (and the renderer module in the development host). The binary
# itself contains no GPU code. A headless run has no window, so no input.
rendering = [
    "dep:winit",
    "dep:pill_input",
    "pill_runtime/rendering",
    "pill_host?/rendering",
]
# Enable Tracy profiling through the shared telemetry stack.
profiling = ["pill_runtime/profiling", "pill_host?/profiling"]
# Investigative fine-grained profiling zones.
profiling-fine = ["pill_runtime/profiling-fine", "pill_host?/profiling-fine"]
# Repeated numerical measurements through the shared metrics recorder.
metrics = ["pill_runtime/metrics", "pill_host?/metrics"]
# Compile the simple developer log macros (`log!`, `dev_warn!`, `dev_error!`).
dev-logs = ["pill_core/dev-logs"]
