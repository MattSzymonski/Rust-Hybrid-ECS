[package]
name = "pill_host"
version = "0.1.0"
edition = "2021"

[dependencies]
pill_core = { path = "../pill_core" }
pill_runtime_api = { path = "../pill_runtime_api", features = ["loader"] }
notify = "6"
tracing = "0.1"
metrics = { version = "0.24", optional = true }
winit = { version = "0.30", optional = true }

[features]
# Windowed mode: the host owns a `winit` window and hands its platform handles
# to the engine runtime, which creates the GPU surface.
#
# The engine runtime is a separate build artifact, not a Cargo dependency, so
# its matching feature is passed on the build command the host runs and is
# verified again through the ABI feature mask.
rendering = [
    "pill_core/rendering",
    "pill_runtime_api/window-handle",
    "dep:winit",
]
# Enable Tracy profiling: the host owns the process-global connection and the
# engine runtime forwards its zones through the ABI log sink.
profiling = ["pill_core/tracy"]
# Investigative fine-grained profiling zones.
profiling-fine = ["profiling", "pill_core/profiling-fine"]
# Repeated numerical measurements through the shared metrics recorder.
metrics = ["dep:metrics", "pill_core/metrics"]
# Compile the simple developer log macros (`log!`, `warn!`, `error!`).
dev-logs = ["pill_core/dev-logs"]
