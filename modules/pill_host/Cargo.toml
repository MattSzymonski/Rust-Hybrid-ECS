[package]
name = "pill_host"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[dependencies]
pill_hot_scan = { path = "../pill_hot_scan" }
pill_engine = { path = "../pill_engine" }
pill_core = { path = "../pill_core" }
# The `#[engine_error]` attribute behind the host's own error types, plus
# the two crates it expands into.
pill_core_macros = { path = "../pill_core_macros" }
thiserror = "2"
miette = { version = "7", features = ["derive"] }
# The renderer contract - the backend trait, the frame, the camera, window
# handles as data - with no wgpu. Linked in every posture.
pill_renderer_api = { path = "../pill_renderer_api" }
# Dependency GRAPH only - never named in code, and renamed so any use stands
# out; the same reason as `renderer_dependency_graph` below, for headless
# builds too. The master renderer's data crate is an extension the host loads
# (first, in every posture), and its module build is resolved together with the
# host. Its dependencies turn on features in crates `pill_core` shares (glam's
# `bytemuck`, for one), and cargo folds those into `pill_core.dll`'s symbol
# names: without this entry a headless host would resolve a different
# `pill_core.dll` than the data module and could not load it. Nothing
# references it, so nothing of it is linked into the host. (The C# bridge
# tests are the one exception: they alias it to bind real renderer components.)
renderer_data_dependency_graph = { package = "pill_master_renderer_data", path = "../extensions/pill_master_renderer_data" }
# Dependency GRAPH only - never named in code, and renamed so any use stands
# out. Every module and project build is resolved together with the running
# host (see `build_runner::apply_cargo_host_overrides`), and cargo folds each
# dependency's resolution into `pill_core.dll`'s symbol names. The renderer
# module's build includes wgpu; if the host's did not, the two would link
# different `pill_core.dll`s and the renderer module could not load. Declaring
# the renderer here puts wgpu's graph into the host's resolution without
# linking any of it: rlibs link as archives, and nothing references this one.
renderer_dependency_graph = { package = "pill_master_renderer", path = "../extensions/pill_master_renderer", optional = true }
libloading = "0.8"
# Development only (`hot_reload`): the source and shader watchers, and the
# cooker the shader watcher runs - the one the renderer data crate's build
# script runs, so a runtime cook matches the build's.
notify = { version = "6", optional = true }
pill_assets = { path = "../pill_assets", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# TOML parsing and editing for the generated workspace-member manifest and for
# reading a project's own Cargo.toml. A real parser replaces the string surgery
# that used to model tables, renames and arrays by hand.
toml_edit = "0.22"
tracing = "0.1"
metrics = { version = "0.24", optional = true }
winit = { version = "0.30", optional = true }

[features]
# On by default: the development posture, where the host watches sources,
# shells out to cargo, and loads the project and every extension as a
# DLL. Turning it OFF selects the shipping posture - nothing is watched, built
# or loaded at runtime, and the project is linked into the binary instead.
default = ["hot_reload"]
# Reload edited code without a restart, and in a windowed host, edited shaders
# of the renderer's data crate without a rebuild.
hot_reload = ["dep:notify", "dep:pill_assets"]
# A windowed host: the winit event loop, and the renderer module it loads and
# attaches to the window. The host itself links no renderer and no wgpu: the
# graphics stack exists only inside that module. Nothing is forwarded to
# `pill_engine` or `pill_core` - neither has a `rendering` feature, which is
# what lets a module and a hot patch link the same engine the host does.
rendering = ["dep:winit", "dep:renderer_dependency_graph"]
# Enable Tracy profiling: engine profiling zones plus the Tracy tracing layer.
profiling = ["pill_engine/profiling", "pill_core/tracy"]
# Investigative fine-grained profiling zones.
profiling-fine = ["profiling", "pill_engine/profiling-fine"]
# Profiling with instrumentation verification (~50% overhead).
profiling-verify = ["profiling", "pill_engine/profiling-verify"]
# Repeated numerical measurements through the shared metrics recorder.
metrics = ["dep:metrics", "pill_engine/metrics"]
# Per-function hot patching: a body-only edit to a `#[pill_hot]` system is
# compiled on its own and swapped into the running engine, instead of rebuilding
# and re-registering the whole module. Development only.
# Implies `hot_reload`: a refused patch falls back to a full module reload, so
# the fallback has to exist for the fast path to be safe to attempt at all.
hot_patch = ["hot_reload", "pill_engine/hot_patch"]
# Compile the simple developer log macros (`log!`, `warn!`, `error!`).
dev-logs = ["pill_core/dev-logs"]
