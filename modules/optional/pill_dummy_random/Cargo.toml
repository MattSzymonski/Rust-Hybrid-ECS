[package]
name = "pill_dummy_random"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[lib]
# The crate root is named after the crate rather than `lib.rs`. Every crate in
# the dependency graph has a `src/lib.rs`, and the Windows debugger falls back
# to matching a breakpoint by file name when the owning module is not mapped -
# always true for a module the host loads at runtime - so a shared name gives
# it hundreds of wrong candidates. `pill_hot_scan` reads this key to know
# which file is the root and emits no module segment for it.
path = "src/pill_dummy_random.rs"
# `cdylib` is the artifact the host loads and hot swaps at runtime. `rlib` is
# kept so a monolithic release build can link the same module statically
# instead, with no second copy of the source.
crate-type = ["cdylib", "rlib"]

[dependencies]
pill_core = { path = "../../pill_core" }
pill_engine = { path = "../../pill_engine" }

[features]
# `module-abi` is opt-in, not a default: building every member in one cargo
# invocation (e.g. `cargo build --workspace`) must not turn on the
# `#[no_mangle]` `pill_module_*` exports for a module's dependency copies.
# Cargo's feature unification would otherwise leak the default onto those
# copies and produce duplicate symbols whenever one module links another in
# the same build. The host passes `--features module-abi` itself when it
# builds the loadable module.
default = []
# Gates the `pill_module_*` C-ABI exports. A crate linked directly into another
# binary (e.g. the project) keeps this off, since two crates exporting the same
# `#[no_mangle]` symbol names into one binary is a linker error; the standalone
# build the host hot-loads passes `--features module-abi` so it stays
# discoverable.
module-abi = []
