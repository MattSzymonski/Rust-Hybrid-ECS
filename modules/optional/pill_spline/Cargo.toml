[package]
name = "pill_spline"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[lib]
# The crate root is named after the crate rather than `lib.rs`. Every crate in
# the dependency graph has a `src/lib.rs`, and the Windows debugger falls back
# to matching a breakpoint by file name when the owning module is not mapped -
# always true for a module the host loads at runtime - so a shared name gives
# it hundreds of wrong candidates. `pill_hot_scan` reads this key to know
# which file is the root and emits no module segment for it.
path = "src/pill_spline.rs"
# `cdylib` is the artifact the host loads and hot swaps at runtime. `rlib` is
# kept both for monolithic release builds and so another module or the project
# can depend on this crate directly to use the `Spline` type.
crate-type = ["cdylib", "rlib"]

[build-dependencies]
pill_hot_scan = { path = "../../pill_hot_scan" }

[dependencies]
pill_core = { path = "../../pill_core" }
pill_engine = { path = "../../pill_engine" }
serde = { version = "1", features = ["derive"] }
# `default-features = false` keeps `pill_dummy_color`'s `pill_module_*` exports
# off in this build. Since `module-abi` is opt-in (not a default) this is a
# no-op today, but it stays as a defensive guard so a future change cannot
# accidentally pull the exports into this cdylib and duplicate the symbols this
# crate itself exports.
pill_dummy_color = { path = "../pill_dummy_color", default-features = false }

[features]
# `module-abi` is opt-in, not a default: building every member in one cargo
# invocation (e.g. `cargo build --workspace`) must not turn on the
# `#[no_mangle]` `pill_module_*` exports for a module's dependency copies.
# Cargo's feature unification would otherwise leak the default onto those
# copies and produce duplicate symbols whenever one module links another (e.g.
# pill_spline -> pill_dummy_color) in the same build. The host passes
# `--features module-abi` itself when it builds the loadable module.
default = []
# Gates the `pill_module_*` C-ABI exports. A crate linked directly into another
# binary (e.g. the project) keeps this off, since two crates exporting the same
# `#[no_mangle]` symbol names into one binary is a linker error; the standalone
# build the host hot-loads passes `--features module-abi` so it stays
# discoverable.
#
# It implies `test-hooks` because the hot-reload and C# bridge suites drive
# loadable module builds through this feature and assert the demo math (the
# mirrored `get_sum` value, the moving sampled midpoint). A statically linked
# shipping build passes neither feature and computes only the documented math.
module-abi = ["test-hooks"]
# Gates the demo observables the integration suites edit: the sampled height
# offset, the mirrored sum shift and the hot-patchable colour offset. Off by
# default, so a shipping crate carries no scaffolding to explain away.
test-hooks = []
