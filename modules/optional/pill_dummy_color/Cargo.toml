[package]
name = "pill_dummy_color"
version = "0.1.0"
edition = "2021"

[lib]
# `cdylib` is the artifact the host loads and hot swaps at runtime. `rlib` is
# kept so a monolithic release build can link the same module statically
# instead, with no second copy of the source.
crate-type = ["cdylib", "rlib"]

[dependencies]
pill_core = { path = "../../pill_core" }
pill_engine = { path = "../../pill_engine" }

[features]
default = ["module-abi"]
# Gates the `pill_module_*` C-ABI exports. A crate linked directly into another
# binary (e.g. the project) disables this, since two crates exporting the same
# `#[no_mangle]` symbol names into one binary is a linker error; the standalone
# build the host hot-loads keeps it enabled so it stays discoverable.
module-abi = []
# Must mirror the host's engine feature set: a module built against a
# differently configured engine can disagree about type layout. The host passes
# this flag automatically when it was itself built with rendering.
rendering = ["pill_engine/rendering"]
