[package]
name = "pill_test"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[lib]
# `cdylib` is the artifact the host loads and hot swaps at runtime. `rlib` is
# kept so a monolithic release build can link the same module statically
# instead, with no second copy of the source.
crate-type = ["cdylib", "rlib"]

[dependencies]
pill_core = { path = "../../pill_core" }
pill_engine = { path = "../../pill_engine" }
trait_type_map = { path = "../../../../Trait-Type-Map" }
serde = { version = "1", features = ["derive"] }

[features]
# `module-abi` is opt-in, not a default (see the other optional modules): the
# host passes `--features module-abi` when it builds the loadable module, and
# the feature keeps the `#[no_mangle]` exports out of any build that links
# this crate statically.
default = []
module-abi = []
