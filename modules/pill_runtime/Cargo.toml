[package]
name = "pill_runtime"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

# Runs a game: owns the engine, registers statically linked modules and the
# project in the engine's order and owners, attaches the renderer to a window
# given as handles, and runs frames. Linked into every executable - the
# development host builds on it, a shipping build and the web frontend use it
# alone. It must never load DLLs, watch or build anything, host .NET, or link
# winit or YAML: whatever a shipped game does not do stays out of here.
[dependencies]
pill_core = { path = "../pill_core" }
# The `#[engine_error]` attribute behind `RenderingError`, plus the two crates
# it expands into.
pill_core_macros = { path = "../pill_core_macros" }
thiserror = "2"
miette = { version = "7", features = ["derive"] }
pill_engine = { path = "../pill_engine" }
# The renderer contract - the backend trait, the frame, window handles as data.
pill_renderer_api = { path = "../pill_renderer_api" }
tracing = "0.1"
metrics = { version = "0.24", optional = true }

[features]
# A windowed runtime: attaching a renderer to a window and drawing frames.
# Without it the runtime names no renderer attach path at all.
rendering = []
# Route profiling spans to Tracy through the shared telemetry stack.
profiling = ["pill_engine/profiling", "pill_core/tracy"]
# Investigative fine-grained profiling zones.
profiling-fine = ["profiling", "pill_engine/profiling-fine"]
# Per-frame numerical measurements through the shared metrics recorder.
metrics = ["dep:metrics", "pill_engine/metrics"]
