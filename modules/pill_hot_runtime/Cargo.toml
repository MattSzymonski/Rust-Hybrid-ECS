[package]
name = "pill_hot_runtime"
version = "0.1.0"
edition = "2021"

[lib]
# An rlib, like `pill_engine` itself. Every artifact that participates in hot
# reloading links its own copy, which is what makes the `inventory` registries
# below per-artifact - the property the whole reload model depends on.
crate-type = ["rlib"]

[dependencies]
inventory = "0.3"

[features]
# Empty, exactly like `pill_engine`'s: it gates the prologue integration
# tests so they keep running in the same configurations as before the
# machinery moved out of `pill_engine`.
hot_patch = []
