[package]
name = "pill_engine"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[dependencies]
pill_core = { path = "../pill_core" }
pill_core_macros = { path = "../pill_core_macros" }
pill_engine_macros = { path = "../pill_engine_macros" }
inventory = "0.3"
rayon = "1.10"
parking_lot = "0.12"
sysinfo = "0.39"
trait_type_map = { path = "../../../Trait-Type-Map" }
tracy-client = { version = "0.18", optional = true, default-features = false }
metrics = { version = "0.24", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
miette = { version = "7", features = ["derive"] }
tracing = "0.1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[features]
# Full profiling: zones, text, plots, messages, threads, frame marks,
# plus Tracy system-level features (sampling, context switches, CPU info).
profiling = [
    "dep:tracy-client",
    "tracy-client/enable",
    "tracy-client/sampling",
    "tracy-client/context-switch-tracing",
    "tracy-client/system-tracing",
    "tracy-client/ondemand",
    "tracy-client/code-transfer",
    "tracy-client/callstack-inlines",
    "tracy-client/crash-handler",
    "pill_core/profiling",
    "pill_core/tracy",
]
# Investigative fine-grained zones (`profile_scope_fine!` -> profile::fine).
profiling-fine = ["profiling", "pill_core/profiling-fine"]
# Minimal overhead: zones + frame marks only. No text, plots, messages, or threads.
profiling-minimal = [
    "dep:tracy-client",
    "tracy-client/enable",
    "tracy-client/sampling",
    "tracy-client/ondemand",
    "pill_core/profiling-minimal",
]
# Debug: full profiling + instrumentation verification (~50% overhead).
profiling-verify = [
    "profiling",
    "tracy-client/verify",
    "pill_core/profiling-verify",
]
# Per-function hot patching: registered systems dispatch through a replaceable
# slot so a rebuilt implementation can be swapped in without re-registering them
# or touching the World. Development only; see `src/hot_patch.rs`.
#
# NOTE: a module or project built WITHOUT this feature is still safe to load
# into a host built WITH it - `HotPatchRegistry` is an unconditional field, so
# `Engine`s layout does not change. Such a module simply registers systems that
# are not hot-patchable.
hot_patch = []

# Emit repeated numerical measurements through the shared `metrics` recorder.
metrics = ["dep:metrics", "pill_core/metrics"]

[[bench]]
name = "entity_lifecycle"
harness = false

[[bench]]
name = "minimal"
harness = false

[[bench]]
name = "query_iteration"
harness = false

[[bench]]
name = "archetype_migration"
harness = false

[[bench]]
name = "scheduler_graph"
harness = false

[[bench]]
name = "frame_loop"
harness = false

[[bench]]
name = "resource_commands"
harness = false

[lib]
name = "pill_engine"
path = "src/lib.rs"
# Still an `rlib`, but no longer because it has to be.
#
# A Rust `dylib` must export every symbol, and while wgpu, naga and winit lived
# in this crate their instantiations pushed the export table past the Windows
# limit of 65535 (`LINK : fatal error LNK1189`) - measured at 74,979 exports.
# With the renderer moved to `pill_wgpu_renderer` that count is 22,623, well
# inside the limit, so the blocker is gone.
#
# Converting is deliberately NOT part of that move: sharing one engine library
# across the host and every loaded module also removes the duplicated statics
# described in `local/documents/modularity_implementation_plan.md`, which is a
# separate architectural decision with its own analysis. It would additionally
# let a hot patch resolve engine symbols through an import library instead of
# reading this crate's 26 MB archive, which is the largest remaining cost in a
# patch - see `local/documents/engine_hot_reload_and_patching_speed_improvements.md`.
crate-type = ["rlib"]

[[bin]]
name = "pill_engine"
path = "src/main.rs"
