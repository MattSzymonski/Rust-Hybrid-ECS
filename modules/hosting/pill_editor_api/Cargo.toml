[package]
name = "pill_editor_api"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

# The editor-shell contract: the plain data the editor executable and the
# reloadable shell module exchange through world resources - what goes in
# (input events, sizes) and what comes back (draw lists, the scene
# rectangle, clipboard requests). A shared `dylib` like `pill_ui`: both the
# executable and the shell module link it, so a resource whose type is
# defined here has one identity across the whole process.
[lib]
crate-type = ["rlib", "dylib"]

[dependencies]
pill_core = { path = "../../pill_core" }
# The `Resource` marker the boundary types implement, and the input events
# the executable translates winit events into.
pill_engine_core = { path = "../../pill_engine_core" }
# The UI vocabulary the boundary carries: draw lists, atlas updates and
# clipboard requests (plan decision D28: clipboard is plain data).
pill_ui = { path = "../../pill_ui" }
