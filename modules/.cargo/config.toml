# Link Rust dependencies dynamically wherever a `dylib` artifact exists, so the
# host executable and every optional module built from this workspace share one
# copy of `pill_engine` instead of each embedding a private one. Sharing the
# engine is what keeps its statics, thread-locals and the tracing dispatcher
# single-instance across the DLL boundary.
#
# Scope: this applies to crates built from inside `modules/`, which is every
# crate that shares this workspace's `Cargo.lock`. Shared dynamic linkage
# requires the exact same dependency resolution on both sides, because a Rust
# dylib exports symbols mangled with a metadata hash derived from the resolved
# graph. Project modules live in their own workspaces with their own lockfiles,
# so they are built with static linkage instead; see `ProjectModuleConfig`.
#
# Release builds link everything into one binary, need no shared library, and
# cannot combine `-C prefer-dynamic` with the release profile's `lto = "fat"` -
# rustc refuses that pairing outright on Windows. Use the `release-build` alias
# below, which clears the flag, rather than remembering to do it by hand.
[build]
rustflags = ["-C", "prefer-dynamic"]

# Release builds must clear this flag, and no cargo setting can do it: cargo
# MERGES config arrays under the same key, so `--config build.rustflags=[]`
# joins with the list above and changes nothing, and a `target.<triple>` list
# does not replace `build.rustflags` either. Only an empty `RUSTFLAGS` in the
# environment works, which a cargo alias cannot set.
#
# Use `devops/ci_cd/build_release.sh` instead. It forwards its arguments, so it
# is a drop-in replacement for `cargo build --release`.

# Use the LLD linker (bundled with the Rust toolchain) instead of MSVC's
# `link.exe` on Windows. LLD is typically 2-4x faster at linking, which
# matters for the hot-reload loop: every module and project reload relinks a
# cdylib, and `link.exe` was the slowest step in the build. `rust-lld` is the
# lld-link-compatible driver, so it drops in for the MSVC target without any
# extra install.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
