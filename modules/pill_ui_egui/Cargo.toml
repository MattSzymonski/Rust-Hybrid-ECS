[package]
name = "pill_ui_egui"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[lib]
name = "pill_ui_egui"
path = "src/lib.rs"
# A shared `dylib`, like `pill_ui` (plan decision E3): the egui editor's
# frontend, its reloadable egui shell module and its model crate all link
# this library, and one compiled copy per process keeps the egui `Context`
# and the boundary types single-instance across the DLL boundary - the
# context's stored values survive a shell reload only while the code that
# owns their drop lives in a DLL that never unloads.
#
# `rlib` is kept for the crate's own unit tests and any static build.
crate-type = ["rlib", "dylib"]

[dependencies]
pill_core = { path = "../pill_core" }
# The engine's core (`Input`, `Resource`), never the `pill_engine` facade:
# the facade is an `rlib` compiled into every artifact, while this crate is
# a shared `dylib` (the reason is written out in `pill_ui`'s manifest).
pill_engine_core = { path = "../pill_engine_core" }
# egui (plan decisions E1, E3): the newest egui whose stock wgpu renderer
# (`egui-wgpu` 0.32.3) works with the engine's pinned wgpu 25. `default_fonts`
# is the one feature this library needs; every consumer names egui through
# this crate's re-exports.
egui = { version = "0.36.2", default-features = false, features = [
    "default_fonts",
] }
# Docking (plan decision E2): tabs, splits and undocked windows. `serde`
# lets the editor's model crate persist the layout.
egui_dock = { version = "0.21.1", default-features = false, features = [
    "serde",
] }

# Feature pins, in the style of `pill_ui`'s pin block: this `dylib`'s
# exported symbol names hash the features of every crate below it, and the
# egui editor's module world (this crate plus the shell) and host world
# (this crate plus the frontend and `egui-wgpu`) must resolve this tree
# identically, or each produces its own `pill_ui_egui.dll` and the shell
# would load against type identities the frontend does not have.
#
# `epaint` is requested with `bytemuck` because `egui-wgpu` asks for it
# (its vertex buffer conversion) and the module world never links
# `egui-wgpu`; neither `egui` nor `egui_dock` adds features beyond the
# requests above, so those need no extra pins.
epaint = { version = "0.36.2", default-features = false, features = [
    "bytemuck",
] }
# `egui` asks `bitflags` for its own use and the egui world adds nothing on
# top; the host world's resolve does, because the host also carries the native
# `pill_ui` (its `cosmic-text` asks `bitflags` for `serde`), and one process
# resolve unifies the two. Pinned here so the module world resolves the same
# tree the host builds this DLL with.
bitflags = { version = "2", features = ["serde"] }
# The same argument for the rest of the editor's shared tree, found by the gate
# on 2026-10-21 (fourteen drift reports against this crate and
# `pill_editor_core_egui`, all of them features the host world turns on and a
# module or project build does not). None of them is used directly.
arrayvec = { version = "0.7", features = ["std"] }
hashbrown = { version = "0.17", features = ["inline-more"] }
kurbo = "0.13"
read-fonts = "0.41"
skrifa = "0.44"
uuid = { version = "1", features = ["std"] }
