[package]
name = "pill_spline"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[lib]
# The crate root is named after the crate rather than `lib.rs`. Every crate in
# the dependency graph has a `src/lib.rs`, and the Windows debugger falls back
# to matching a breakpoint by file name when the owning module is not mapped -
# always true for a module the host loads at runtime - so a shared name gives
# it hundreds of wrong candidates. `pill_hot_scan` reads this key to know
# which file is the root and emits no module segment for it.
path = "src/pill_spline.rs"
# `rlib` only: the artifact the host loads is built by the generated
# `host_module_pill_spline` wrapper, which links this crate as a library, and
# another module or the project can depend on it directly to use the `Spline`
# type. All of them compile one identical copy of the sources.
crate-type = ["rlib"]

[build-dependencies]
pill_hot_scan = { path = "../../hosting/pill_hot_scan" }

[dependencies]
pill_core = { path = "../../pill_core" }
pill_engine = { path = "../../pill_engine" }
serde = { version = "1", features = ["derive"] }
# `default-features = false` is a defensive no-op today (`pill_dummy_color`
# declares no defaults); it stays so a default added there cannot pull extra
# code into this crate's copies behind its back.
pill_dummy_color = { path = "../pill_dummy_color", default-features = false }

[features]
default = []
# Gates the demo observables the integration suites edit: the sampled height
# offset, the mirrored sum shift and the hot-patchable colour offset. Off by
# default, so a shipping crate carries no scaffolding to explain away. The
# generated `host_module_pill_spline` wrapper enables every declared feature,
# so the module build and the project build compute the same demo math.
test-hooks = []
