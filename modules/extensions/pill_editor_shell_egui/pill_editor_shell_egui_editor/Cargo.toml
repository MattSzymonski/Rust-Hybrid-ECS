[package]
name = "pill_editor_shell_egui_editor"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

# The crate's build script emits the function-address inventory the host uses
# to patch any function, annotated or not. Without it only `#[pill_hot]`
# systems (which go through the engine's registry) can be patched, while an
# edit to `run_frame` or a tab body falls back to a full reload.
[build-dependencies]
pill_hot_scan = { path = "../../../hosting/pill_hot_scan" }

[lib]
# Named after the crate rather than `lib.rs`, like every extension crate.
path = "src/pill_editor_shell_egui_editor.rs"
# `rlib` only: the artifact an editor host loads is built by the generated
# `host_module_pill_editor_shell_egui_editor` wrapper in this folder's
# `generated/`.
crate-type = ["rlib"]

# The egui editor's shell: the docked UI the egui frontend shows, rebuilt
# and swapped while the editor runs. An editor-only extension (the folder
# holds only this crate): loaded by the egui editor, never by a game (see
# the `editor_frontend` tag below).
[dependencies]
pill_core = { path = "../../../engine/pill_core" }
# The engine facade: the module ABI (`pill_module`), the hot attributes and
# the system resource parameters.
pill_engine = { path = "../../../engine/pill_engine" }
# The model and the egui library: the dock, the shared selection, the engine
# snapshots, and the context, the style and the boundary resources.
pill_editor_core = { path = "../../../frontends/editor/pill_editor_core" }
# The asset settings documents the Inspector edits are JSON.
serde_json = "1"

[package.metadata.pill]
# This shell builds the egui editor's UI; it is the only editor frontend
# (W-0017 Stage 6/7; the `pill_ui` frontend retired in W-0043).
editor_frontend = "egui"
