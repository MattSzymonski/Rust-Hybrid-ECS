[package]
name = "pill_editor_shell_editor"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[lib]
# Named after the crate rather than `lib.rs`, like every extension crate.
path = "src/pill_editor_shell_editor.rs"
# `rlib` only: the artifact an editor host loads is built by the generated
# `host_module_pill_editor_shell_editor` wrapper in this folder's `generated/`.
crate-type = ["rlib"]

# The editor shell: every part of the editor that reloads while it runs -
# panel dispatch now, commands, menus and undo in the stages after. An
# editor-only extension (the folder holds only this crate): loaded by an
# editor host, never built by a game.
[dependencies]
pill_core = { path = "../../../pill_core" }
pill_engine = { path = "../../../pill_engine" }
# The shell's UI: built with `pill_ui`, uploaded and presented by the
# executable through `pill_ui_wgpu`.
pill_ui = { path = "../../../pill_ui" }
# Docking: the layout model and its geometry, shared with the executable
# through the same dylib.
pill_editor_core = { path = "../../../frontents/pill_editor_core" }
# The boundary: what the executable feeds in and what the shell hands back.
pill_editor_api = { path = "../../../hosting/pill_editor_api" }
# The native layout file's format: the same `LayoutModel` the classic
# editor persisted, in the native editor's own file.
serde_json = "1"

[package.metadata.pill]
# This shell builds the `pill_ui` editor's UI; the egui editor loads its own
# shell instead (W-0017 Stage 6).
editor_frontend = "pill_ui"
