[package]
name = "pill_master_renderer"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
pill_core = { path = "../../../pill_core" }
pill_core_macros = { path = "../../../pill_core_macros" }
pill_engine = { path = "../../../pill_engine" }
trait_type_map = { git = "https://github.com/MattSzymonski/Trait-Type-Map", rev = "25343a9eac856445b0fa8266df5b000326d1574b" }

serde = { version = "1", features = ["derive"] }
thiserror = "2"
miette = { version = "7", features = ["derive"] }
glam = { version = "0.33", features = ["serde", "bytemuck"] }
winit = "0.30.12"
bytemuck = { version = "1.4", features = ["derive"] }
wgpu = "25.0.0"
pollster = "0.4"
# The GPU caches key their slot tables the way the shader assets do.
indexmap = "2"
# The renderer's data half: components, assets, pipelines, the frame and the
# backend trait. Everything wgpu-free lives there.
pill_renderer_api = { path = "../../../pill_renderer_api" }

[features]
default = []
# Forwarded to the data crate, which owns the shaders and their reload.
shader-hot-reload = ["pill_renderer_api/shader-hot-reload"]
