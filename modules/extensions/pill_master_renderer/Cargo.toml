[package]
name = "pill_master_renderer"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

# `cdylib` for the host to load and reload as a module; `rlib` for its tests
# and a shipping build that links it statically.
[lib]
# `rlib` only: the artifact the host loads is built by the generated
# `host_module_pill_master_renderer` wrapper, which links this crate as a
# library; `pill_host` reaches the same hashed build through
# `renderer_dependency_graph`.
crate-type = ["rlib"]

[dependencies]
pill_core = { path = "../../pill_core" }
pill_core_macros = { path = "../../pill_core_macros" }
pill_engine = { path = "../../pill_engine" }
trait_type_map = { git = "https://github.com/MattSzymonski/Trait-Type-Map", rev = "25343a9eac856445b0fa8266df5b000326d1574b" }

serde = { version = "1", features = ["derive"] }
thiserror = "2"
miette = { version = "7", features = ["derive"] }
glam = { version = "0.33", features = ["serde", "bytemuck"] }
bytemuck = { version = "1.4", features = ["derive"] }
wgpu = "25.0.0"
# The GPU caches key their slot tables the way the shader assets do.
indexmap = "2"
# The renderer contract: the backend trait this crate implements, the frame it
# draws, and the window it attaches to.
pill_renderer_api = { path = "../../hosting/pill_renderer_api" }
# This renderer's data crate: its components, assets, pipelines and shaders.
# Everything wgpu-free that is specific to the master renderer lives there.
pill_master_renderer_data = { path = "../pill_master_renderer_data" }
