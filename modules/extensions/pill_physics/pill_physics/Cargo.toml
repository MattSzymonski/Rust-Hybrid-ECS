[package]
name = "pill_physics"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[lib]
# The crate root is named after the crate rather than `lib.rs`. Every crate has
# a `src/lib.rs`, and the Windows debugger falls back to matching a breakpoint by
# file name when the owning module is not mapped - always true for a module the
# host loads at runtime - so a shared name gives it hundreds of wrong
# candidates. `pill_hot_scan` reads this key to know which file is the root.
path = "src/pill_physics.rs"
# `rlib` only: the artifact the host loads is built by the generated
# `host_module_pill_physics` wrapper, which links this crate as a library, and a
# project can depend on it directly to name the components in a query. Both
# compile one identical copy of the sources.
crate-type = ["rlib"]

[build-dependencies]
pill_hot_scan = { path = "../../../hosting/pill_hot_scan" }

[dependencies]
pill_core = { path = "../../../engine/pill_core" }
pill_engine = { path = "../../../engine/pill_engine" }
# `impl_trait_accessible!`, which registers `PhysicsSettingsAsset` with the
# type-erased asset columns. The engine depends on it too, and both must be the
# same crate for the trait objects to match.
trait_type_map = { git = "https://github.com/MattSzymonski/Trait-Type-Map", rev = "25343a9eac856445b0fa8266df5b000326d1574b" }
serde = { version = "1", features = ["derive"] }
# The simulation. Not optional: whether a project simulates physics is decided
# by whether it loads this module, so a second switch inside the crate would
# only be a way for the two to disagree. The default features give the 3D f32
# build with the sequential solver, so the process keeps its one shared Rayon
# pool and starts no thread of its own.
rapier3d = "0.36"
