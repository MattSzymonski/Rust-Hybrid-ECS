[package]
name = "stacked_boxes"
version = "0.1.0"
edition = "2021"

[lib]
# `cdylib` for a hot-reloading build, where the host loads this as a DLL.
# `rlib` so a shipping or web build can link the project straight into the
# binary - a cdylib cannot be a Rust library dependency.
crate-type = ["cdylib", "rlib"]

[dependencies]
pill_engine = { path = "../../../../engine/pill_engine" }
pill_physics = { path = "../../pill_physics" }

# A project is not a Cargo workspace member: the host generates a
# `host_project_stacked_boxes` crate and builds it against this manifest.
[workspace]
