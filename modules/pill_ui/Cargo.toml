[package]
name = "pill_ui"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[lib]
name = "pill_ui"
path = "src/lib.rs"
# A shared `dylib`, like `pill_engine_core` (plan decision D17): the editor
# executable, the reloadable editor shell module, editor crates, the GPU
# module and projects all use this library, and one compiled copy per process
# keeps its state - the font database, the glyph and icon atlases, the draw
# plane - single-instance across the DLL boundary. With `-C prefer-dynamic`
# every user imports `pill_ui.dll`; a change to this crate rebuilds its
# dependents and restarts the editor.
#
# `rlib` is kept so a shipping build, which clears `prefer-dynamic`, links the
# library statically.
crate-type = ["rlib", "dylib"]

[dependencies]
pill_core = { path = "../pill_core" }
pill_engine = { path = "../pill_engine" }
# Text shaping, line breaking and rasterization (plan decision D6). Defaults
# off: the crate's `fontconfig`/`sys-locale` defaults serve its own automatic
# FontSystem setup, which `pill_ui` replaces with its own font database (the
# bundled font first, system fonts after). `swash` is the shaping and
# rasterization backend (no `rustybuzz`, no C shaping stack).
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
# Font discovery and loading, version-matched to the crate `cosmic-text`
# 0.19 resolves (its `fontdb` edge is 0.23, `default-features = false`), so
# one copy serves both. `fs` reads font files through `std`; `fontconfig`
# parses the platform's fontconfig configuration on Linux (pure Rust); the
# `memmap` feature arrives through `cosmic-text`'s `std` and has a web-target
# stub, so it costs the web build nothing.
fontdb = { version = "0.23", default-features = false, features = ["std", "fs", "fontconfig"] }
# SVG icon rasterization on the CPU (plan decision D6). Defaults off: icons
# are plain vector SVGs, so the text, raster-image, gzip and font features are
# dead weight (and the text feature would pull a second shaping stack).
resvg = { version = "0.48", default-features = false }
# The process locale for font matching, the same crate `cosmic-text`'s `std`
# feature resolves; read once in `TextSystem::new`.
sys-locale = "0.3"

# Feature pins, in the style of `pill_core`'s pin block (plan decision D17).
# pill_ui is a `dylib`, and its exported symbol names hash the features of
# every crate below it. The editor posture's dioxus and wgpu graphs union
# features onto crates in this tree that the other postures do not - the
# renderer's `wgpu-core` turns on `arrayvec`'s `default`+`std`, and dioxus
# turns on `bitflags`'s `serde`. Requesting the union here keeps the
# resolution identical in every build. Neither crate is used directly.
arrayvec = { version = "0.7", features = ["std"] }
bitflags = { version = "2", features = ["serde"] }
