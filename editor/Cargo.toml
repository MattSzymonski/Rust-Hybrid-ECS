[package]
name = "editor"
version = "0.1.0"
edition = "2021"

[dependencies]
host = { package = "pill_host", path = "../host", features = ["rendering"] }
pill_core = { path = "../pill_core", features = ["rendering"] }
pill_core_macros = { path = "../pill_core_macros" }
dioxus = { version = "0.7", features = ["desktop"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
miette = { version = "7", features = ["derive"] }
tracing = "0.1"

[features]
# Enable Tracy profiling through the shared telemetry stack.
profiling = ["host/profiling"]
# Investigative fine-grained profiling zones.
profiling-fine = ["host/profiling-fine"]
# Repeated numerical measurements through the shared metrics recorder.
metrics = ["host/metrics"]
# Compile the simple developer log macros (`log!`, `warn!`, `error!`).
dev-logs = ["host/dev-logs"]
