[package]
name = "pill_core"
version = "0.1.0"
edition = "2021"

[dependencies]
pill_core_macros = { path = "../pill_core_macros" }
pill_engine = { path = "../engine" }
libloading = "0.8"
notify = "6"
serde_json = "1"
thiserror = "2"
miette = { version = "7", features = ["derive", "fancy"] }
colored = "2"
winit = { version = "0.30", optional = true }

[features]
rendering = ["pill_engine/rendering", "dep:winit"]
