# Scheduled heavy lanes: the end-to-end hot-reload suites and the hot-reload
# benchmark. These drive real host processes and real builds, so they are not
# per-commit checks. Every run's log is uploaded so the comparison scripts in
# devops/benchmarks/ have durable output to read.
#
# Requirements on the runner: Rust stable (cargo), Python 3, and the .NET 8
# SDK that the C# runtime compiles against.
name: Nightly hot reload + benchmarks

on:
  # The schedule is disabled for now; uncomment it to re-enable the nightly run.
  # The workflow still runs manually from the Actions tab.
  # schedule:
  #   # 04:00 UTC daily.
  #   - cron: "0 4 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  hot-reload:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: modules
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build the standalone host
        working-directory: modules
        run: cargo build -p pill_standalone --features rendering
      - name: Migration suite
        shell: pwsh
        run: python devops/tests/test_hot_reload_migration.py *> migration-suite.log
      - name: Hot-reload suite
        # Session B carries a known fixture drift (recorded in
        # local/docs/simplification_backlog.md), so a failure is captured and
        # uploaded rather than failing the nightly.
        shell: pwsh
        continue-on-error: true
        run: python devops/tests/test_hot_reload_suite.py *> hot-reload-suite.log
      - name: Hot-reload benchmark
        shell: pwsh
        continue-on-error: true
        run: python devops/benchmarks/hot_reload.py --iterations 3 *> hot-reload-benchmark.log
      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hot-reload-logs
          path: "*.log"
          if-no-files-found: ignore
