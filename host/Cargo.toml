[package]
name = "host"
version = "0.1.0"
edition = "2021"

[dependencies]
ecs_hybrid = { path = "../engine" }
libloading = "0.8"
notify = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trait_type_map = { path = "../../Trait-Type-Map" }
winit = { version = "0.30", optional = true }

[features]
rendering = ["ecs_hybrid/rendering", "dep:winit"]
