[package]
name = "pill_host"
version = "0.1.0"
edition = "2021"

[dependencies]
pill_engine = { path = "../engine" }
pill_core = { path = "../pill_core" }
libloading = "0.8"
notify = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trait_type_map = { path = "../../Trait-Type-Map" }
winit = { version = "0.30", optional = true }

[features]
rendering = ["pill_engine/rendering", "pill_core/rendering", "dep:winit"]
