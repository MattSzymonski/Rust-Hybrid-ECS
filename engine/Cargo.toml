[package]
name = "pill_engine"
version = "0.1.0"
edition = "2021"

[dependencies]
pill_core = { path = "../pill_core" }
pill_core_macros = { path = "../pill_core_macros" }
rayon = "1.10"
parking_lot = "0.12"
sysinfo = "0.39"
trait_type_map = { path = "../../Trait-Type-Map" }
tracy-client = { version = "0.18", optional = true, default-features = false }
metrics = { version = "0.24", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
miette = { version = "7", features = ["derive"] }
tracing = "0.1"
wgpu = { version = "26.0.1", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
pollster = { version = "0.4", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[features]
# Full profiling: zones, text, plots, messages, threads, frame marks,
# plus Tracy system-level features (sampling, context switches, CPU info).
profiling = [
    "dep:tracy-client",
    "tracy-client/enable",
    "tracy-client/sampling",
    "tracy-client/context-switch-tracing",
    "tracy-client/system-tracing",
    "tracy-client/ondemand",
    "tracy-client/code-transfer",
    "tracy-client/callstack-inlines",
    "tracy-client/crash-handler",
    "pill_core/profiling",
    "pill_core/tracy",
]
# Investigative fine-grained zones (`profile_scope_fine!` -> profile::fine).
profiling-fine = ["profiling", "pill_core/profiling-fine"]
# Minimal overhead: zones + frame marks only. No text, plots, messages, or threads.
profiling-minimal = [
    "dep:tracy-client",
    "tracy-client/enable",
    "tracy-client/sampling",
    "tracy-client/ondemand",
    "pill_core/profiling-minimal",
]
# Debug: full profiling + instrumentation verification (~50% overhead).
profiling-verify = [
    "profiling",
    "tracy-client/verify",
    "pill_core/profiling-verify",
]
# Emit repeated numerical measurements through the shared `metrics` recorder.
metrics = ["dep:metrics", "pill_core/metrics"]
# Minimal 2D renderer (wgpu-backed): Position/Sprite components, the sprite
# pipeline, and window-surface/device/queue lifecycle. Frontends supply only a
# compatible window handle and drive the engine Renderer API.
rendering = ["dep:wgpu", "dep:bytemuck", "dep:pollster", "pill_core/rendering"]

[[bench]]
name = "entity_lifecycle"
harness = false

[[bench]]
name = "query_iteration"
harness = false

[[bench]]
name = "archetype_migration"
harness = false

[[bench]]
name = "scheduler_graph"
harness = false

[[bench]]
name = "frame_loop"
harness = false

[[bench]]
name = "resource_commands"
harness = false

[[bench]]
name = "minimal"
harness = false

[lib]
name = "pill_engine"
path = "src/lib.rs"

[[bin]]
name = "pill_engine"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Speed-optimized release profile: trades binary size for maximum throughput.
# Uses opt-level=3 (aggressive inlining, loop unrolling, auto-vectorization)
# instead of opt-level="s" (size-optimized). Recommended for production
# deployments where throughput matters more than binary size.
[profile.release-fast]
inherits = "release"
opt-level = 3

[profile.release-with-debug]
inherits = "release"
debug = true
